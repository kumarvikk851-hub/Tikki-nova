name: Build Tikki Nova Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/build.android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Debug Keystore
        uses: actions/cache@v4
        id: cache-keystore
        with:
          path: ~/.android/debug.keystore
          key: tikki-debug-keystore-v1

      - name: Prepare web files & Capacitor
        run: |
          mkdir -p www
          cp index.html logo.png manifest.json sw.js www/
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-community/admob@7 @capacitor-firebase/authentication@7
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.tikkinova.app",
            "appName": "Tikki Nova",
            "webDir": "www",
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": true,
                "providers": ["google.com"]
              }
            }
          }
          EOF
          npx cap add android
          cp google-services.json android/app/google-services.json

      - name: Configure AdMob, Google Auth, Permissions & App Icon
        run: |
          python3 -m pip install pillow
          python3 - << 'EOF'
          import os
          from PIL import Image

          with open('android/variables.gradle', 'r', encoding='utf-8') as f:
              vg = f.read()
          if 'rgcfaIncludeGoogle' not in vg:
              vg = vg.replace('ext {', "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'", 1)
          with open('android/variables.gradle', 'w', encoding='utf-8') as f:
              f.write(vg)

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              txt = f.read()

          perms = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'
          ]
          for p in perms:
              if p not in txt:
                  txt = txt.replace('<application', '    ' + p + '\n    <application', 1)

          admob_meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6839469344776433~9992728365"/>'
          if 'com.google.android.gms.ads.APPLICATION_ID' not in txt:
              txt = txt.replace('</application>', '        ' + admob_meta + '\n    </application>', 1)

          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(txt)

          img = Image.open('logo.png').convert('RGBA')
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }
          for folder, sz in sizes.items():
              out_dir = os.path.join('android/app/src/main/res', folder)
              os.makedirs(out_dir, exist_ok=True)
              resized = img.resize((sz, sz), Image.LANCZOS)
              for name in ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png']:
                  resized.save(os.path.join(out_dir, name), 'PNG')
          EOF
          npx cap sync android

      - name: Ensure Debug Keystore & Print SHA-1
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          SHA1=$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -m1 "SHA1:" | awk '{print $2}')
          echo "### APK SHA-1 Fingerprint (Add to Firebase):" >> $GITHUB_STEP_SUMMARY
          echo "\`$SHA1\`" >> $GITHUB_STEP_SUMMARY
          echo "SHA1=$SHA1"

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikkiNova-AdMob-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
